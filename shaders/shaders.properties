# shaders.properties
# ============================================================
# BLENDHER -- shader configuration
# FIX: shadowRes -> shadow.resolution, shadowDistance -> shadow.distance
#      colortex3 changed from RGB8 to RGBA8 (stores lightmap RG + bloom)
#      colortex4 removed (was unused, caused buffer count warnings)
# ============================================================

# GBuffer color attachments
texture.colortex0=RGBA8          # albedo + alpha
texture.colortex1=RGB8_SNORM     # world normals (signed)
texture.colortex2=RGBA8          # specular / PBR flags (g=1 flags water)
texture.colortex3=RGBA8          # lightmap (RG) / bloom bright-pass (RGB)

# Shadow map settings (correct OptiFine property names)
shadow.resolution=2048
shadow.distance=128.0

# Wind-affected block IDs (matched to displacement.glsl ID constants)
block.10001=grass short_grass tall_grass fern large_fern
block.10002=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves azalea_leaves flowering_azalea_leaves mangrove_leaves cherry_leaves
block.10003=wheat potatoes carrots beetroots hanging_roots cave_vines_plant

# Distant Horizons integration
iris.features=DISTANT_HORIZONS

# Composite pass ordering
program.composite=composite
program.composite1=composite1
program.composite2=composite2
